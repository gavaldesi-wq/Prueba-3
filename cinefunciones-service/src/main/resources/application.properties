spring.application.name=cinefunciones-service
server.port=8082
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:mysql://mysql:3306/db_funciones?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=logs/cinefunciones-service.log
logging.level.root=INFO
logging.level.com.cinefunciones_service=DEBUG
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html